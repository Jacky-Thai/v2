<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eufy Baby</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b0b0b;color:#fff}
.header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:rgba(15,15,15,.75);backdrop-filter:blur(14px);border-bottom:1px solid #2a2a2a;z-index:100}
.back{background:none;border:none;color:#fff;font-size:16px; font-weight: 700; cursor:pointer}
.hero{max-width:1200px;margin:40px auto;padding:0 20px}
.hero img{width:100%;border-radius:20px;display:block}
.info{
    text-align:center;
}

.info h1{
    margin:0;
    font-size:48px;
    font-weight:700;
}

.info h1::after{
    content:"";
    display:block;
    width:300px;          /* hoặc 200px */
    height:2px;
    background:#3a3a3a;
    margin:20px auto 0;   /* auto sẽ căn giữa */
}
.masonry{

    max-width:1200px;
    margin:20px auto;
    padding:0 20px;

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;

}

.card{

    position:relative;
    border-radius:16px;
    overflow:hidden;

}

@media(max-width:640px){

    .masonry{

        grid-template-columns:1fr;

    }

}
.card{break-inside:avoid;margin-bottom:20px;position:relative;border-radius:16px;overflow:hidden}
.card img{width:100%;display:block}
.hover{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:.25s}
.card:hover .hover{opacity:1}
.lightbox{

    position: fixed;
    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.94);

    padding: 40px;

    z-index: 9999;

    cursor: default;

}

.lightbox img{

    max-width: 95vw;
    max-height: 95vh;

    object-fit: contain;

    border-radius: 12px;

}

/* ===========================
   LIGHTBOX CLOSE BUTTON
=========================== */

.lightbox-close{

    position: fixed;

    top: 24px;
    left: 24px;      /* Đổi từ right sang left */

    border: none;
    background: none;

    color: #fff;

    font-size: 32px; /* Nhỏ lại */

    font-weight: 700; /* Bold */

    line-height: 1;

    cursor: pointer;

    transition: opacity .2s;

    padding: 0;

    z-index: 10000;

}

.lightbox-close:hover{

    opacity: .7;

}

.video-section{

    max-width:1200px;
    margin:30px auto;
    padding:0 20px;

}


.video-wrapper{

    position:relative;

    width:100%;

    aspect-ratio:16/9;

    border-radius:24px;

    overflow:hidden;

}

.video-wrapper iframe{

    width:100%;
    height:100%;

    border:none;
}

.hero-card{
    grid-column: 1 / -1;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    margin-top:5px;
}

.hero-card img{
    width:100%;
    display:block;
}
</style>
</head>

<div class="lightbox" id="lb">

    <button class="lightbox-close" onclick="closeImg(event)">
        ✕
    </button>

    <img id="lbimg">

</div>
<script>
const lightbox = document.getElementById("lb");
const lightboxImage = document.getElementById("lbimg");

function openImg(src){

    lightboxImage.src = src;

    lightbox.style.display = "flex";

    document.body.style.overflow = "hidden";

}

function closeImg(event){

    if(event){
        event.stopPropagation();
    }

    lightbox.style.display = "none";

    document.body.style.overflow = "";

}

document.addEventListener("keydown",function(e){

    if(e.key==="Escape" && lightbox.style.display==="flex"){

        closeImg();

    }

});

function backToAnker() {
    history.back();
}

</script>
